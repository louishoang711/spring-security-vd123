<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Users')}"></head><body><main class="container"><div class="page-title"><h1>Users</h1><a class="button" th:href="@{/users/new}">Thêm user</a></div><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/users}" method="get" class="search"><input name="keyword" th:value="${keyword}" placeholder="Tìm username, email, họ tên"><button>Tìm</button></form><p>Tổng số: <span th:text="${users.totalElements}">0</span></p><table><thead><tr><th>Username</th><th>Email</th><th>Họ tên</th><th>Role</th><th>Products</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="u : ${users.content}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.roleName}"></td><td th:text="${u.productCount}"></td><td th:text="${u.enabled ? 'Active' : 'Disabled'}"></td><td><a th:href="@{/users/{id}/edit(id=${u.id})}">Sửa</a><form th:action="@{/users/{id}/delete(id=${u.id})}" method="post"><button>Xóa</button></form></td></tr></tbody></table><nav class="pager"><a th:if="${users.hasPrevious()}" th:href="@{/users(keyword=${keyword},page=${users.number-1})}">Trước</a><span th:text="${users.number+1}">1</span><a th:if="${users.hasNext()}" th:href="@{/users(keyword=${keyword},page=${users.number+1})}">Sau</a></nav><a th:href="@{/}">Trang chủ</a></main></body></html>
