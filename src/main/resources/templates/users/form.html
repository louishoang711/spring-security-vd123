<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('User')}"></head><body><main class="auth-card"><h1>User</h1><form th:action="${id == null ? '/users/save' : '/users/' + id + '/save'}" th:object="${form}" method="post"><div class="error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username</label><input th:field="*{username}" required><label>Email</label><input th:field="*{email}" type="email" required><label>Họ tên</label><input th:field="*{fullName}" required><label>Ảnh URL</label><input th:field="*{imageUrl}"><label>Vai trò</label><select th:field="*{roleName}"><option value="ROLE_USER">USER</option><option value="ROLE_ADMIN">ADMIN</option></select><label><input type="checkbox" th:field="*{enabled}"> Kích hoạt</label><label>Mật khẩu (để trống khi sửa để giữ nguyên)</label><input th:field="*{password}" type="password"><button class="button">Lưu</button></form><a th:href="@{/users}">Quay lại</a></main></body></html>
