<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Products')}"></head><body><main class="container"><div class="page-title"><h1>Products</h1><a class="button" th:href="@{/products/new}">Thêm product</a></div><form th:action="@{/products}" method="get" class="search"><input name="keyword" th:value="${keyword}" placeholder="Tìm tên product"><button>Tìm</button></form><p>Tổng số: <span th:text="${products.totalElements}">0</span></p><table><thead><tr><th>Ảnh</th><th>Tên</th><th>Giá</th><th>Chủ sở hữu</th><th></th></tr></thead><tbody><tr th:each="p : ${products.content}"><td><img th:if="${p.imageUrl}" th:src="${p.imageUrl}" alt="Product" width="60"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.userName}"></td><td><a th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a><form th:action="@{/products/{id}/delete(id=${p.id})}" method="post"><button>Xóa</button></form></td></tr></tbody></table><nav class="pager"><a th:if="${products.hasPrevious()}" th:href="@{/products(keyword=${keyword},page=${products.number-1})}">Trước</a><span th:text="${products.number+1}">1</span><a th:if="${products.hasNext()}" th:href="@{/products(keyword=${keyword},page=${products.number+1})}">Sau</a></nav><a th:href="@{/}">Trang chủ</a></main></body></html>
