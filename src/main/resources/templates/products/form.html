<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Product')}"></head><body><main class="auth-card"><h1>Product</h1><form th:action="${id == null ? '/products/save' : '/products/' + id + '/save'}" th:object="${form}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Tên</label><input th:field="*{name}" required><label>Mô tả</label><textarea th:field="*{description}"></textarea><label>Giá</label><input th:field="*{price}" type="number" step="0.01" min="0" required><label>Ảnh (cần Cloudinary)</label><input name="image" type="file" accept="image/*"><button class="button">Lưu</button></form><a th:href="@{/products}">Quay lại</a></main></body></html>
