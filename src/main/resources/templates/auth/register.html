<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đăng ký')}"></head><body><main class="auth-card"><h1>Đăng ký</h1><form th:action="@{/register}" th:object="${form}" method="post"><div class="error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><label>Username</label><input th:field="*{username}" required><label>Email</label><input type="email" th:field="*{email}" required><label>Họ tên</label><input th:field="*{fullName}" required><label>Mật khẩu</label><input type="password" th:field="*{password}" required minlength="8"><label>Nhập lại mật khẩu</label><input type="password" th:field="*{confirmPassword}" required><button class="button">Gửi OTP</button></form><p><a th:href="@{/login}">Đăng nhập</a></p></main></body></html>
