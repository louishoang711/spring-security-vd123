<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head><body><main class="auth-card"><h1>Đặt lại mật khẩu</h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/reset-password}" method="post"><label>Email</label><input name="email" type="email" th:value="${param.email}" required><label>Mã OTP</label><input name="code" required><label>Mật khẩu mới</label><input name="password" type="password" minlength="8" required><button class="button">Đổi mật khẩu</button></form></main></body></html>
